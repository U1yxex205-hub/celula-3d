<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Modelo 3D interactivo de una célula animal con fichas de estudio de sus organelos.">
<title>Célula 3D de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de microscopio — visor 3D a la izquierda, ficha y modos a la derecha; en teléfono se apilan. */
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#17201b; --muted:#5a665f; --line:#d3dbd5;
  --accent:#1f7a5a; --accent-soft:#d8ece3; --stage:#dfe5e0; --warn:#9a5b13; --bad:#b0362c;
  --label-bg:rgba(251,252,251,.92);
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#151d19; --ink:#e4ece7; --muted:#97a69d; --line:#2a3630;
  --accent:#5cc79c; --accent-soft:#1d3a2e; --stage:#0b100d; --warn:#e2a35a; --bad:#ff8a7a; --label-bg:rgba(21,29,25,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#151d19; --ink:#e4ece7; --muted:#97a69d; --line:#2a3630;
  --accent:#5cc79c; --accent-soft:#1d3a2e; --stage:#0b100d; --warn:#e2a35a; --bad:#ff8a7a; --label-bg:rgba(21,29,25,.9); color-scheme:dark}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:16px;box-sizing:border-box}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;max-width:1320px;margin:0 auto;height:100%;min-height:600px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:460px}
@media (max-width:900px){.stage{height:68vh}}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
svg.labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.labels line{stroke:var(--ink);stroke-width:1;opacity:.55}
svg.labels circle{fill:var(--ink)}
.lbl{position:absolute;transform:translate(-50%,-50%);font:500 11.5px/1.2 var(--f-body);background:var(--label-bg);border:1px solid var(--line);padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:auto;cursor:pointer;color:var(--ink)}
.lbls{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.tag{font:500 12px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 10px;border-radius:6px;align-self:flex-start}
.toggles{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toggles label{display:flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);background:var(--panel);border:1px solid var(--line);padding:6px 9px;border-radius:6px;cursor:pointer}
.sliders{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;z-index:3}
.sl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font:500 12px var(--f-body);flex:1 1 200px;min-width:0}
.sl span{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:62px;flex:none}
.sl input{flex:1;min-width:0;accent-color:var(--accent)}
.status{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--f-mono);color:var(--muted)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 13px var(--f-body);padding:12px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{padding:18px 22px;border-bottom:1px solid var(--line);overflow:auto;flex:1 1 auto;min-height:0}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:650 26px/1.15 var(--f-display);margin:6px 0 4px;text-wrap:balance}
.node{font:12px var(--f-mono);color:var(--muted)}
.card p{margin:12px 0 0;max-width:62ch}
.card ul,.card ol{margin:12px 0 0;padding-left:20px;display:grid;gap:7px}
.src{display:inline-block;font:600 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.src.f{color:var(--accent)} .src.c{color:var(--warn)}
.legend{font-size:12px;color:var(--muted);margin-top:14px}
.list{padding:10px 14px 14px;overflow:auto;flex:0 1 auto;max-height:48%}
@media (max-width:900px){.list{max-height:none}}
.group h2{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer}
.chip:hover,.btn:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}
.chip.sm{border-style:dashed}
.qh{font-size:22px}
.steps li{padding:4px 6px;border-radius:6px}
.steps li.on{background:var(--accent-soft)}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-left:6px}
.qmodes{margin-top:10px}
.refs{font-size:12.5px;gap:4px!important;color:var(--muted)}
.refs a{color:var(--accent)}
details{margin-top:12px;font-size:13px}summary{cursor:pointer;color:var(--accent);font-weight:600}
.card h3{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.analog{background:var(--accent-soft);padding:8px 12px;border-radius:6px}
.dato{font-size:14px}
.new{font:600 10px var(--f-mono);color:var(--accent);letter-spacing:.05em}
.steps li.on{font-weight:600;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.score{font:600 32px var(--f-display);font-variant-numeric:tabular-nums}
.ok{color:var(--accent);font-weight:600}.no{color:var(--bad);font-weight:600}
</style>
</head>
<body>

<div class="wrap">
  <section class="stage" id="stage">
    <canvas id="c" aria-label="Modelo 3D de una célula animal"></canvas>
    <svg class="labels" id="lines"></svg><div class="lbls" id="lbls"></div>
    <div class="status" id="status">Cargando modelo…</div>
    <div class="hud">
      <span class="tag" id="sel-tag">Toca un organelo</span>
      <div class="toggles">
        <label><input type="checkbox" id="t-lbl"> Etiquetas</label>
        <label><input type="checkbox" id="t-mem"> Membrana</label>
        <label><input type="checkbox" id="t-cyt" checked> Citosol</label>
        <label><input type="checkbox" id="t-ske" checked> Citoesqueleto</label>
        <label><input type="checkbox" id="t-rot"> Girar</label>
      </div>
    </div>
    <div class="sliders">
      <label class="sl"><span>Corte</span><input type="range" id="s-cut" min="0" max="100" value="0" aria-label="Profundidad del plano de corte"></label>
      <label class="sl"><span>Separar</span><input type="range" id="s-exp" min="0" max="100" value="0" aria-label="Separar organelos"></label>
    </div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-explorar" aria-selected="true">Explorar</button>
      <button role="tab" id="tab-procesos" aria-selected="false">Procesos</button>
      <button role="tab" id="tab-examen" aria-selected="false">Examen</button>
    </div>
    <div class="card" id="card" aria-live="polite"></div>
    <div class="list" id="list"></div>
  </aside>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const F='f', C='c';
const T1='1 · Retículo endoplásmico',T2='2 · Golgi y citoesqueleto',T3='3 · Lisosomas y peroxisomas',T4='4 · Núcleo y mitocondria',TO='Otros';
// Order matters: the first pattern that matches a mesh name wins.
const ORG = [
 {id:'rer',tema:T1,nombre:'RE rugoso',color:'#5f4b9b',grp:'rer',match:/^(Reticulo_endoplasmatico_rugoso|Ribosomas_\d|RE_rugoso_union)/,nodo:'Reticulo_endoplasmatico_rugoso · Ribosomas_1–3 · RE_rugoso_union_envoltura',
  resumen:'Cisternas cubiertas de ribosomas. Los túbulos nuevos lo unen a la membrana externa del núcleo: es una sola red.',
  puntos:[[F,'La SRP reconoce la secuencia señal y la cadena entra al lumen mientras se sintetiza.'],[F,'BiP, calnexina y PDI pliegan; lo mal plegado sale al proteasoma.'],[F,'La oligosacaril transferasa inicia la N-glicosilación.'],[C,'Si se acumulan proteínas mal plegadas se activa la UPR (estrés del RE).']]},
 {id:'rel',tema:T1,nombre:'RE liso',color:'#8c3a85',grp:'rel',match:/^(Reticulo_endoplasmatico_liso|RE_liso_union)/,nodo:'Reticulo_endoplasmatico_liso · RE_liso_union_rugoso',
  resumen:'Túbulos sin ribosomas, continuos con el RE rugoso. Lípidos, esteroides, desintoxicación y calcio.',
  puntos:[[F,'HMG-CoA reductasa y otras enzimas del RE hacen colesterol y hormonas esteroideas.'],[F,'El citocromo P450 modifica fármacos y toxinas lipofílicas.'],[F,'El IP3 libera el Ca²⁺ guardado en las cisternas.'],[C,'Abundante en el hígado y en células que fabrican hormonas esteroideas.']]},
 {id:'ribo',tema:T1,nombre:'Ribosomas libres y polisomas',color:'#d23a52',grp:'ribo',match:/^(Ribosomas_libres|Polisomas|ARNm)/,nodo:'Ribosomas_libres · Polisomas · ARNm',nuevo:'agregados',
  resumen:'Ribosomas sueltos en el citosol, solos o en fila sobre un ARNm (polisoma).',
  puntos:[[C,'Hacen, entre otras, las proteínas del citosol y las de los peroxisomas.'],[C,'Los del RE rugoso hacen proteínas de membrana y de secreción: el destino lo decide la secuencia señal.']]},
 {id:'golgi',tema:T2,nombre:'Aparato de Golgi',color:'#7a63d6',grp:'golgi',match:/^(Aparato_de_Golgi|Red_trans_Golgi)/,nodo:'Aparato_de_Golgi · Red_trans_Golgi_yemas',nuevo:'colores cis→trans',
  resumen:'Azul = cara cis (recibe del RE) · violeta = medial · rojo = cara trans y red trans-Golgi (despacha).',
  puntos:[[F,'Recorta y completa oligosacáridos; une lípidos a proteínas.'],[F,'La giantina y GM130 anclan las vesículas que llegan del RE.'],[F,'La TGN envía a membrana plasmática, endosomas y lisosomas.'],[C,'Polaridad cis/medial/trans y marcaje con manosa-6-fosfato.']]},
 {id:'copii',tema:T2,nombre:'Vesículas COPII',color:'#73ccf5',grp:'copii',match:/^Vesiculas_COPII/,nodo:'Vesiculas_COPII',nuevo:'agregadas',
  resumen:'Celeste: del RE a la cara cis del Golgi (transporte anterógrado).',puntos:[[F,'Llevan las proteínas recién plegadas del RE al Golgi.']]},
 {id:'copi',tema:T2,nombre:'Vesículas COPI',color:'#dbd64d',grp:'copi',match:/^Vesiculas_COPI$/,nodo:'Vesiculas_COPI',nuevo:'agregadas',
  resumen:'Amarillo pálido: regresan del Golgi al RE (transporte retrógrado).',puntos:[[F,'COPI opera junto con COPII en el RE y el Golgi.'],[C,'Devuelven proteínas residentes del RE (señal KDEL).']]},
 {id:'clat',tema:T2,nombre:'Vesículas de clatrina',color:'#e6e6ea',grp:'clat',match:/^(Vesiculas_clatrina|Cubierta_clatrina)/,nodo:'Vesiculas_clatrina · Cubierta_clatrina',nuevo:'agregadas',
  resumen:'La jaula blanca es la cubierta de clatrina; salen de la red trans-Golgi hacia endosomas y lisosomas.',
  puntos:[[F,'La clatrina forma una jaula geodésica que da la fuerza para que brote la vesícula.'],[F,'Al separarse, la cubierta se desensambla.']]},
 {id:'ves',tema:T2,nombre:'Vesículas secretoras',color:'#e0c22c',grp:'ves',match:/^Vesiculas_de_transporte/,nodo:'Vesiculas_de_transporte',
  resumen:'Vesículas grandes que llevan producto hacia la membrana para la exocitosis.',puntos:[[C,'Se fusionan con la membrana plasmática y liberan su contenido.']]},
 {id:'mt',tema:T2,nombre:'Microtúbulos',color:'#5cc76b',grp:'mt',match:/^Microtubulos/,nodo:'Microtubulos',nuevo:'agregados',
  resumen:'Tubos verdes que salen del centrosoma hacia la periferia. Son las vías del transporte.',
  puntos:[[F,'Tubulina α/β, 13 protofilamentos, 25 nm.'],[F,'Cinesinas y dineínas caminan sobre ellos; forman el huso mitótico.'],[F,'La colchicina impide su polimerización.'],[C,'Los taxanos los estabilizan y frenan la mitosis.']]},
 {id:'act',tema:T2,nombre:'Microfilamentos de actina',color:'#e05238',grp:'act',match:/^Microfilamentos_actina/,nodo:'Microfilamentos_actina',nuevo:'agregados',
  resumen:'Red roja bajo la membrana: la corteza de actina.',
  puntos:[[F,'Actina G → F, doble hélice de 5–7 nm.'],[F,'Empuja pseudópodos, forma el anillo contráctil y ancla uniones adherentes.'],[F,'Las miosinas se mueven sobre ella.']]},
 {id:'fi',tema:T2,nombre:'Filamentos intermedios',color:'#409eb3',grp:'fi',match:/^Filamentos_intermedios/,nodo:'Filamentos_intermedios',
  resumen:'Red turquesa que da resistencia mecánica a toda la célula.',puntos:[[F,'Los más estables: queratinas en epitelios, láminas en el núcleo.'],[C,'De 8 a 10 nm de diámetro.']]},
 {id:'cent',tema:T2,nombre:'Centríolos',color:'#c9a514',grp:'cent',match:/^Centriolos/,nodo:'Centriolos',
  resumen:'Par de cilindros de 9 tripletes de microtúbulos. De aquí nacen los microtúbulos verdes.',
  puntos:[[F,'Organizan el huso mitótico.'],[F,'El axonema 9+2 de cilios y flagelos se dobla por la dineína.']]},
 {id:'aut',tema:T3,nombre:'Autofagosoma',color:'#9b7ad0',grp:'aut',match:/^(Autofagosoma|Lisosoma_fusionandose)/,nodo:'Autofagosoma · Lisosoma_fusionandose',nuevo:'agregado',
  resumen:'Doble membrana que envuelve una mitocondria vieja; un lisosoma se fusiona con ella para digerirla.',
  puntos:[[F,'La autofagia recicla componentes propios junto con el lisosoma.'],[C,'El autofagosoma se fusiona con el lisosoma, que digiere su contenido.']]},
 {id:'fag',tema:T3,nombre:'Fagosoma',color:'#cc8ca6',grp:'fag',match:/^(Fagosoma|Bacteria_fagocitada|Lisosoma_hacia_fagosoma)/,nodo:'Fagosoma_membrana · Bacteria_fagocitada · Lisosoma_hacia_fagosoma',nuevo:'agregado',
  resumen:'Bacteria ya internalizada; un lisosoma se acerca para fusionarse y digerirla.',
  puntos:[[F,'La fagocitosis internaliza partículas grandes por endomembranas.'],[C,'Así matan bacterias los macrófagos y neutrófilos.']]},
 {id:'lis',tema:T3,nombre:'Lisosomas',color:'#5c38b8',grp:'lis',match:/^Lisosomas/,nodo:'Lisosomas · Lisosomas_hidrolasas',nuevo:'rehechos',
  resumen:'Esferas de una membrana con gránulos de hidrolasas dentro.',
  puntos:[[F,'Digestión intracelular; si se rompen, inflaman el tejido.'],[C,'pH cercano a 5, mantenido por una bomba de protones; sus enzimas llegan marcadas con manosa-6-fosfato.'],[C,'Depósito lisosomal: Gaucher, Tay-Sachs.']]},
 {id:'perox',tema:T3,nombre:'Peroxisomas',color:'#7cc04f',grp:'perox',match:/^Peroxisoma/,nodo:'Peroxisoma_1–4',
  resumen:'Una membrana y núcleo cristaloide. Producen y destruyen H₂O₂.',
  puntos:[[F,'La catalasa degrada el H₂O₂.'],[F,'Perdieron su DNA (De Duve).'],[C,'Beta-oxidación de cadena muy larga, plasmalógenos; Zellweger.']]},
 {id:'env',tema:T4,nombre:'Envoltura nuclear y poros',color:'#7d3fc0',grp:'nuc',match:/^(Envoltura_nuclear|Poros_nucleares|Membrana_nuclear_interna)/,nodo:'Envoltura_nuclear · Membrana_nuclear_interna · Poros_nucleares',nuevo:'doble membrana',
  resumen:'Dos membranas con el espacio perinuclear entre ellas; la externa sigue en el RE. Los poros las atraviesan.',
  puntos:[[F,'Los poros regulan el tráfico en ambos sentidos con importinas.'],[F,'Su andamiaje se parece a COPI/COPII.']]},
 {id:'lam',tema:T4,nombre:'Lámina nuclear',color:'#33ccdb',grp:'nuc',match:/^Lamina_nuclear/,nodo:'Lamina_nuclear',nuevo:'agregada',
  resumen:'Malla turquesa de láminas pegada por dentro a la membrana interna.',
  puntos:[[F,'Sostiene la envoltura y ancla cromatina (láminas tipo A).'],[C,'Mutaciones en LMNA causan laminopatías como la progeria.']]},
 {id:'het',tema:T4,nombre:'Heterocromatina',color:'#141a6b',grp:'nuc',match:/^Heterocromatina/,nodo:'Heterocromatina',nuevo:'agregada',
  resumen:'Grumos oscuros en la periferia y alrededor del nucléolo: cromatina condensada e inactiva.',puntos:[[F,'Las láminas A se unen a la heterocromatina.'],[F,'Está condensada y casi no se transcribe.']]},
 {id:'eu',tema:T4,nombre:'Eucromatina y nucleoplasma',color:'#6185fa',grp:'nuc',match:/^(Eucromatina|Nucleoplasma)/,nodo:'Eucromatina_1–4 · Nucleoplasma',
  resumen:'Cromatina laxa y activa, en el centro del núcleo.',
  puntos:[[F,'DNA en nucleosomas; RNA polimerasa a ~30 nt/s; caperuza, poli-A y splicing.'],[F,'Replicación en la fase S.']]},
 {id:'nucleolo',tema:T4,nombre:'Nucléolo',color:'#8a1680',grp:'nuc',match:/^Nucleolo/,nodo:'Nucleolo',
  resumen:'Donde se transcribe el RNA ribosomal y se ensamblan los ribosomas.',puntos:[[F,'Sin membrana propia.']]},
 {id:'mmem',tema:T4,nombre:'Mitocondria: membranas',color:'#ee8533',grp:'mitoc',match:/^(Mito_membrana_externa|Mito_membrana_interna|Mito_ATP)/,nodo:'Mito_membrana_externa · Mito_membrana_interna · Mito_ATP_sintasa',nuevo:'mitocondria en corte',
  resumen:'Externa (naranja, con porinas) e interna (más clara, con ATP sintasas cafés). Entre ellas, el espacio intermembrana.',
  puntos:[[F,'La cadena respiratoria bombea H⁺ al espacio intermembrana.'],[F,'Los H⁺ regresan por la ATP sintasa, que forma ATP.'],[F,'Libera citocromo c → apoptosoma → caspasas 9 y 3.']]},
 {id:'mcr',tema:T4,nombre:'Mitocondria: crestas',color:'#fac75c',grp:'mitoc',match:/^Mito_crestas/,nodo:'Mito_crestas',nuevo:'mitocondria en corte',
  resumen:'Pliegues de la membrana interna que aumentan la superficie para producir ATP.',puntos:[[F,'Membrana interna hasta 75 % proteína.']]},
 {id:'mmat',tema:T4,nombre:'Mitocondria: matriz y mtDNA',color:'#ffeb9e',grp:'mitoc',match:/^(Mito_matriz|Mito_DNA|Mito_ribosomas)/,nodo:'Mito_matriz · Mito_DNA_circular · Mito_ribosomas',nuevo:'mitocondria en corte',
  resumen:'Ciclo de Krebs, DNA circular (anillo magenta) y ribosomas propios.',
  puntos:[[F,'DNA circular y ribosomas tipo bacteriano: origen endosimbiótico.'],[C,'Puede haber mezcla de DNA mitocondrial sano y mutado (heteroplasmia); causa enfermedades como MELAS y LHON.']]},
 {id:'mito',tema:T4,nombre:'Mitocondrias',color:'#c56a1f',grp:'mito',match:/^Mitocondria(_\d)?$/,nodo:'Mitocondria · Mitocondria_2–5',nuevo:'4 más',
  resumen:'Mitocondrias enteras. Mira la que está en corte para ver su interior.',puntos:[[F,'Producen ATP por fosforilación oxidativa.']]},
 {id:'cit',tema:TO,nombre:'Citosol',color:'#9ecbeb',grp:'cyt',match:/^Citosol/,nodo:'Citosol',nuevo:'agregado',

new ResizeObserver(resize).observe(stage);resize();

const meshes=[]; const byOrg=new Map(); const grpInfo=new Map();
const clip=new THREE.Plane(); let cutN=new THREE.Vector3(), cutRange=[0,1], cellCenter=new THREE.Vector3(), cellSize=1, celula;
const anchors=new Map(); const meshByName=new Map(); let modelRoot=null;

new GLTFLoader().load('celula.glb',g=>{
  const root=g.scene;modelRoot=root;scene.add(root);root.updateMatrixWorld(true);
  celula=root.getObjectByName('Celula');
  root.traverse(n=>{ if(!n.isMesh) return;
    let p=n,org=null; while(p&&!org){org=ORG.find(o=>o.match.test(p.name))||null;p=p.parent;}
    if(!org){n.visible=false;return;}
    n.material=n.material.clone(); const m=n.material; m.clippingPlanes=[clip];
    n.userData={org,baseOpacity:m.opacity,baseTransparent:m.transparent,home:n.position.clone()};
    if(org.id==='mem') n.visible=false;
    meshByName.set(n.name,n); meshes.push(n); if(!byOrg.has(org.id)) byOrg.set(org.id,[]); byOrg.get(org.id).push(n);
  });
  // cell frame from the membrane
  const box=new THREE.Box3(); byOrg.get('mem').forEach(m=>box.expandByObject(m));
  box.getCenter(cellCenter); cellSize=box.getSize(new THREE.Vector3()).length();
  const ex=celula.userData.plano_corte;
  const nm=new THREE.Matrix3().getNormalMatrix(celula.matrixWorld);
  cutN=new THREE.Vector3(...ex.normal).applyMatrix3(nm).normalize();
  // range of the cut along the plane normal
  const pr=[];byOrg.get('mem').forEach(m=>{const pos=m.geometry.attributes.position,v=new THREE.Vector3();for(let i=0;i<pos.count;i+=7){v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);pr.push(v.dot(cutN));}});
  const all=[];meshes.forEach(m=>{if(m.userData.org.id==='mem')return;const pos=m.geometry.attributes.position,v=new THREE.Vector3();for(let i=0;i<pos.count;i+=97){v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);all.push(v.dot(cutN));}});
  cutRange=[Math.min(...pr),Math.max(...all)+2]; setCut(0);
  // group centroids (for separating) + label anchors
  for(const o of ORG){const ms=byOrg.get(o.id);if(!ms)continue;
    const c=new THREE.Vector3(),v=new THREE.Vector3();let k=0;
    ms.forEach(m=>{const pos=m.geometry.attributes.position,st=Math.max(1,pos.count/400|0);for(let i=0;i<pos.count;i+=st){v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);c.add(v);k++;}});
    c.divideScalar(k);
    let best=null,bd=1e18;ms.forEach(m=>{const pos=m.geometry.attributes.position,st=Math.max(1,pos.count/600|0);for(let i=0;i<pos.count;i+=st){v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);const d=v.distanceToSquared(c);if(d<bd){bd=d;best=v.clone();}}});
    anchors.set(o.id,{c,a:best});
    const gk=o.grp; if(!grpInfo.has(gk)) grpInfo.set(gk,{sum:new THREE.Vector3(),n:0}); grpInfo.get(gk).sum.add(c.clone().multiplyScalar(k)); grpInfo.get(gk).n+=k;
  }
  controls.target.copy(cellCenter);
  camera.position.copy(cellCenter).add(new THREE.Vector3(0.15,0.75,0.9).normalize().multiplyScalar(cellSize*1.3));
  controls.minDistance=cellSize*.12;controls.maxDistance=cellSize*3;camera.near=cellSize/600;camera.far=cellSize*20;camera.updateProjectionMatrix();
  buildLabels(); $('status').hidden=true; render();
},xhr=>{if(xhr.total)$('status').textContent=`Cargando modelo… ${Math.round(xhr.loaded/xhr.total*100)} %`;},err=>{$('status').textContent='No se pudo cargar el modelo: '+(err&&err.message||err);console.error(err);});

function setCut(t){ // t: 0 = sin corte .. 1 = corte profundo
  const d=cutRange[1]-(cutRange[1]-cutRange[0])*t*0.85;
  clip.set(cutN.clone().negate(),d);
}
$('s-cut').addEventListener('input',e=>setCut(e.target.value/100));

let explode=0;
function setExplode(t){explode=t;
  for(const m of meshes){const o=m.userData.org;
    if(FIXED.has(o.id)){m.visible=visibleFor(o)&&t<0.05;continue;}
    m.visible=visibleFor(o);
    const gi=grpInfo.get(o.grp); const gc=gi.sum.clone().divideScalar(gi.n);
    const dir=gc.clone().sub(cellCenter); const w=dir.clone().multiplyScalar(t*0.75);
    // world offset -> parent local
    const inv=new THREE.Matrix4().copy(m.parent.matrixWorld).invert(); const l0=new THREE.Vector3().applyMatrix4(inv),l1=w.clone().applyMatrix4(inv);
    m.position.copy(m.userData.home).add(l1.sub(l0));
  }}
$('s-exp').addEventListener('input',e=>setExplode(e.target.value/100));
function visibleFor(o){
  if(o.id==='mem') return $('t-mem').checked;
  if(o.id==='cit') return $('t-cyt').checked;
  if(['mt','act','fi'].includes(o.id)) return $('t-ske').checked;
  return true;
}
function refreshVis(){setExplode(explode);applyHighlight();}
['t-mem','t-cyt','t-ske'].forEach(id=>$(id).addEventListener('change',refreshVis));
const rot=$('t-rot');rot.addEventListener('change',()=>controls.autoRotate=rot.checked&&!reduce);

function applyHighlight(){
  if(anim) return;
  const focus=quiz.active?quiz.focus:(!current||current.sinModelo?null:current);
  for(const n of meshes){const m=n.material,u=n.userData;
    const on=!focus||u.org===focus;
    if(on){m.transparent=u.baseTransparent;m.opacity=u.baseOpacity;m.depthWrite=!u.baseTransparent;}
    else{m.transparent=true;m.opacity=['act','fi','mt','cit'].includes(u.org.id)?0.02:0.07;m.depthWrite=false;}
    if(m.emissive) m.emissive.setRGB(...(focus&&u.org===focus?[0.12,0.12,0.12]:[0,0,0]));
    m.needsUpdate=true;}
}
function select(o){current=o; if(mode==='explorar') card.innerHTML=orgCard(o); tag.textContent=o?o.nombre:'Toca un organelo'; renderList(); applyHighlight(); updateLabels();}

// ---------- labels
const lines=$('lines'), lbls=$('lbls'); const labelEls=new Map();
function buildLabels(){
  for(const o of ORG){if(!anchors.has(o.id)||['mem','cit'].includes(o.id))continue;
    const d=document.createElement('button');d.className='lbl';d.textContent=o.nombre;d.hidden=true;d.onclick=()=>{if(mode==='explorar')select(current===o?null:o);else if(mode==='examen')answer(o);};
    lbls.appendChild(d);labelEls.set(o.id,d);}
}
function updateLabels(){
  const show=$('t-lbl').checked&&!quiz.active&&!(anim&&anim.mito); lines.innerHTML='';
  if(!show){labelEls.forEach(e=>e.hidden=true);return;}
  const r=stage.getBoundingClientRect(),cx=r.width/2,cy=r.height/2; let svg='';
  for(const [id,el] of labelEls){const o=ORG.find(x=>x.id===id);
    const vis=(byOrg.get(id)||[]).some(m=>m.visible)&&(!current||current.sinModelo||current.id===id);
    if(!vis){el.hidden=true;continue;}
    const m0=byOrg.get(id)[0]; const off=new THREE.Vector3().setFromMatrixPosition(m0.matrixWorld);
    const base=new THREE.Vector3().setFromMatrixPosition(m0.parent.matrixWorld.clone().multiply(new THREE.Matrix4().makeTranslation(m0.userData.home.x,m0.userData.home.y,m0.userData.home.z)));
    const a=anchors.get(id).a.clone().add(off.sub(base)).project(camera);
    if(a.z>1){el.hidden=true;continue;}
    const x=(a.x+1)/2*r.width,y=(1-a.y)/2*r.height; let dx=x-cx,dy=y-cy; const L=Math.hypot(dx,dy)||1;
    const lx=x+dx/L*46,ly=y+dy/L*30;
    el.hidden=false;el.style.left=lx+'px';el.style.top=ly+'px';
    svg+=`<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}"/><circle cx="${x}" cy="${y}" r="2.2"/>`;}
  lines.innerHTML=svg;
}
$('t-lbl').addEventListener('change',updateLabels);

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return;
  const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(meshes.filter(m=>m.visible),false).filter(h=>clip.distanceToPoint(h.point)>=0);
  const focus=quiz.active||!current||current.sinModelo?null:current;
  const pick=hits.find(h=>!['mem','cit','act','fi'].includes(h.object.userData.org.id)&&(!focus||h.object.userData.org===focus||h.object.material.opacity>0.5))||hits.find(h=>h.object.userData.org.id!=='cit')||null;
  if(mode==='examen'){ if(pick) answer(pick.object.userData.org); return; }
  if(!pick){select(null);return;}
  const o=pick.object.userData.org; if(mode!=='explorar') setMode('explorar'); select(current===o?null:o);
});

// ---------- mitosis: escena esquemática animada
const MITO={group:new THREE.Group(),built:false,saved:null};
MITO.group.visible=false; scene.add(MITO.group);
const smooth=(a,b,t)=>{const x=Math.min(1,Math.max(0,(t-a)/(b-a)));return x*x*(3-2*x);};
function buildMitosis(){
  const G=MITO.group; MITO.built=true;
  const mat=(c,o=1,extra={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,transparent:o<1,opacity:o,depthWrite:o>=1},extra));
  // membrana deformable
  const mg=new THREE.SphereGeometry(1,72,48); MITO.base=mg.attributes.position.array.slice();
  MITO.mem=new THREE.Mesh(mg,mat(0x9fd3c7,.22,{side:THREE.DoubleSide})); G.add(MITO.mem);
  MITO.memEdge=new THREE.Mesh(mg,new THREE.MeshBasicMaterial({color:0x5aa894,wireframe:true,transparent:true,opacity:.06})); G.add(MITO.memEdge);
  // núcleo de interfase + núcleos hijos
  const nuc=()=>new THREE.Mesh(new THREE.SphereGeometry(.46,40,28),mat(0xb79be0,.28,{side:THREE.DoubleSide}));
  MITO.nuc=nuc(); G.add(MITO.nuc); MITO.nucA=nuc(); MITO.nucB=nuc(); G.add(MITO.nucA,MITO.nucB);
  const nlo=()=>new THREE.Mesh(new THREE.SphereGeometry(.09,20,14),mat(0x8a1680,.9));
  MITO.nlo=nlo(); MITO.nlo.position.set(.12,.12,0); G.add(MITO.nlo); MITO.nloA=nlo(); MITO.nloB=nlo(); G.add(MITO.nloA,MITO.nloB);
  // cromosomas: 2 pares de homólogos (rojo materno, azul paterno); cada cromosoma = 2 cromátidas × 2 brazos
  const specs=[{L:.34,c:0xd9534f},{L:.34,c:0x3b6fd6},{L:.22,c:0xe8857f},{L:.22,c:0x7d9de6}];
  const rnd=(s=>()=>(s=Math.sin(s)*10000,s-Math.floor(s)))(7);
  MITO.chr=specs.map((sp,k)=>{
    const th=k/specs.length*Math.PI*2+0.4;
    const inter=new THREE.Vector3((rnd()-.5)*.35,(rnd()-.5)*.35,(rnd()-.5)*.35);
    const uInt=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize();
    const plate=new THREE.Vector3(0,.24*Math.cos(th),.24*Math.sin(th));
    const uPl=new THREE.Vector3(0,-Math.sin(th),Math.cos(th));
    const sis=[-1,1].map(sg=>{
      const arms=[0,1].map(()=>{const g=new THREE.CapsuleGeometry(.032,sp.L/2,4,10);g.translate(0,sp.L/4+.016,0);const m=new THREE.Mesh(g,mat(sp.c));G.add(m);return m;});
      const kin=new THREE.Mesh(new THREE.SphereGeometry(.03,12,8),mat(0xf2c230));G.add(kin);
      return {sg,arms,kin};});
    return {...sp,inter,uInt,plate,uPl,sis};
  });
  // centrosomas (par de centríolos cada uno)
  const cen=()=>{const g=new THREE.Group();const m=mat(0xe0c22c);const a=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.08,10),m),b=a.clone();b.rotation.z=Math.PI/2;b.position.x=.04;g.add(a,b);G.add(g);return g;};
  MITO.cenA=cen(); MITO.cenB=cen();
  // huso: segmentos dinámicos
  MITO.nAst=14; MITO.nPol=6; const nSeg=MITO.nAst*2+MITO.nPol*2+8;
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nSeg*6),3));
  MITO.lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x3fae5a,transparent:true,opacity:0})); G.add(MITO.lines);
  MITO.ast=[...Array(MITO.nAst)].map(()=>new THREE.Vector3(rnd()*.6+.4,(rnd()-.5)*1.6,(rnd()-.5)*1.6).normalize());
  MITO.pol=[...Array(MITO.nPol)].map((_,i)=>new THREE.Vector3(0,.12*Math.cos(i),.12*Math.sin(i)));
  // anillo contráctil
  MITO.ring=new THREE.Mesh(new THREE.TorusGeometry(1,.035,10,64),mat(0xe05238)); MITO.ring.rotation.y=Math.PI/2; G.add(MITO.ring);
}
function setOp(m,o){m.visible=o>0.01;m.material.opacity=o*(m.userData.maxO??(m.userData.maxO=m.material.opacity));}
function updateMitosis(t){
  const M=MITO, e=1+0.4*smooth(5,6,t), pinch=0.97*smooth(6.6,7.9,t);
  // membrana
  const pos=M.mem.geometry.attributes.position, B=M.base;
  for(let i=0;i<pos.count;i++){let x=B[3*i]*e,y=B[3*i+1],z=B[3*i+2];const s=1-pinch*Math.exp(-(x*x)/0.09);pos.setXYZ(i,x,y*s,z*s);}
  pos.needsUpdate=true; M.mem.geometry.computeVertexNormals();
  const poleX=0.92*e, rep=smooth(1,1.6,t), cond=0.12+0.88*smooth(2,2.9,t)-0.8*smooth(6.2,7.1,t);
  // núcleos y nucléolos
  setOp(M.nuc,1-smooth(2.4,3.4,t)); M.nuc.scale.setScalar(1+0.08*smooth(2.4,3.4,t));
  setOp(M.nlo,1-smooth(2,2.6,t));
  const dn=smooth(6.3,7.1,t); [M.nucA,M.nucB].forEach((n,k)=>{n.position.set((k?1:-1)*0.72*e,0,0);n.scale.setScalar(.75);setOp(n,dn);});
  const dl=smooth(6.8,7.4,t); [M.nloA,M.nloB].forEach((n,k)=>{n.position.set((k?1:-1)*0.72*e+.06,.06,0);n.scale.setScalar(.7);setOp(n,dl);});
  // centrosomas
  const sep=smooth(2,3,t), dup=smooth(1.2,1.8,t);
  const c0=new THREE.Vector3(0,.62,0);
  M.cenA.position.copy(c0).lerp(new THREE.Vector3(-poleX,0,0),sep);
  M.cenB.position.copy(c0).add(new THREE.Vector3(.1,0,0)).lerp(new THREE.Vector3(poleX,0,0),sep);
  M.cenB.visible=dup>0.02; M.cenB.scale.setScalar(Math.max(.01,dup));
  // cromosomas
  const toPlate=smooth(3,4.6,t), ana=smooth(5,5.9,t), telo=smooth(6.1,7,t);
  const Y=new THREE.Vector3(0,1,0), q=new THREE.Quaternion();
  for(const c of M.chr){
    const cen=c.inter.clone().lerp(c.plate,toPlate); const u=c.uInt.clone().lerp(c.uPl,toPlate).normalize();
    const lenF=1+1.6*(1-cond), radF=.35+.65*cond;
    for(const s of c.sis){
      const vis=s.sg<0?1:rep;
      const off=(s.sg*0.035)*(0.3+0.7*cond);
      let p=cen.clone().add(new THREE.Vector3(off,0,0));
      if(ana>0){const goal=new THREE.Vector3(s.sg*poleX*0.68,c.plate.y*.8,c.plate.z*.8);p.lerp(goal,ana);}
      if(telo>0){const nucC=new THREE.Vector3(s.sg*0.72*e,0,0);p.lerp(nucC.clone().add(c.plate.clone().multiplyScalar(.6)),telo*.6);}
      s.kin.position.copy(p); s.kin.visible=vis>0.5&&cond>0.5; s.kin.scale.setScalar(Math.max(.01,cond));
      s.arms.forEach((a,k)=>{const sgn=k?1:-1;
        const d=u.clone().multiplyScalar(sgn*(1-ana*0.7)).add(new THREE.Vector3(-s.sg*ana*0.9,0,0)).normalize();
        q.setFromUnitVectors(Y,d); a.quaternion.copy(q); a.position.copy(p);
        a.scale.set(radF,lenF*(.6+.4*cond),radF); a.visible=vis>0.5;});
      s.p=p;
    }
  }
  // huso
  const spO=smooth(2.2,3.2,t)*(1-smooth(6.2,6.9,t)), kO=smooth(3,3.8,t)*(1-smooth(5.9,6.5,t));
  const arr=M.lines.geometry.attributes.position.array; let w=0;
  const seg=(a,b)=>{arr[w++]=a.x;arr[w++]=a.y;arr[w++]=a.z;arr[w++]=b.x;arr[w++]=b.y;arr[w++]=b.z;};
  const PA=M.cenA.position, PB=M.cenB.position;
  for(const d of M.ast){seg(PA,PA.clone().add(new THREE.Vector3(-d.x,d.y,d.z).multiplyScalar(.32*spO)));seg(PB,PB.clone().add(d.clone().multiplyScalar(.32*spO)));}
  for(const o of M.pol){seg(PA,PA.clone().lerp(o.clone().setX(.12),spO));seg(PB,PB.clone().lerp(o.clone().setX(-.12),spO));}
  for(const c of M.chr) for(const s of c.sis){const P0=s.sg<0?PA:PB; seg(P0,P0.clone().lerp(s.p,kO));}
  M.lines.geometry.attributes.position.needsUpdate=true; M.lines.material.opacity=0.85*Math.max(spO,kO);
  // anillo contráctil
  const rO=smooth(6.4,6.8,t); M.ring.visible=rO>0.01; M.ring.scale.setScalar(Math.max(.03,1-pinch)); M.ring.material.opacity=rO; M.ring.material.transparent=true;
}
function enterMitosis(){
  if(!MITO.built) buildMitosis();
  MITO.saved={pos:camera.position.clone(),target:controls.target.clone(),cut:+$('s-cut').value};
  modelRoot.visible=false; MITO.group.visible=true;
  const R=cellSize*0.2; MITO.group.scale.setScalar(R); MITO.group.position.copy(cellCenter);
  const dir=camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(cellCenter); camera.position.copy(cellCenter).addScaledVector(dir,R*6.2);
  clip.constant=1e9; updateMitosis(0);
}
function exitMitosis(){
  if(!MITO.group.visible) return;
  MITO.group.visible=false; modelRoot.visible=true;
  if(MITO.saved){camera.position.copy(MITO.saved.pos);controls.target.copy(MITO.saved.target);setCut(MITO.saved.cut/100);}
}

const tmpV=new THREE.Vector3();
function worldPath(key){return celula.userData[key].map(p=>celula.localToWorld(new THREE.Vector3(...p)));}
function meshCenter(name){const m=meshByName.get(name);if(!m)return cellCenter.clone();m.geometry.computeBoundingSphere();return m.geometry.boundingSphere.center.clone().applyMatrix4(m.matrixWorld);}
function nearestOn(name,p){const m=meshByName.get(name);const pos=m.geometry.attributes.position,v=new THREE.Vector3();let best=null,bd=1e18;const s=Math.max(1,pos.count/3000|0);for(let i=0;i<pos.count;i+=s){v.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);const d=v.distanceToSquared(p);if(d<bd){bd=d;best=v.clone();}}return best;}
function P(spec){
  if(spec==='mem') return worldPath('ruta_secrecion').at(-1);
  if(spec==='cent') return celula.localToWorld(new THREE.Vector3(...celula.userData.centrosoma));
  const [k,v]=spec.split(/:(.*)/s);
  if(k==='a') return anchors.get(v).a.clone();
  if(k==='c') return anchors.get(v).c.clone();
  if(k==='r') return worldPath('ruta_secrecion').at(+v);
  if(k==='mt'){const pts=worldPath('microtubulo_cinesina');return new THREE.CatmullRomCurve3(pts).getPointAt(+v);}
  if(k==='mesh') return meshCenter(v);
  if(k==='nm'){const [name,sp]=v.split('@');return nearestOn(name,P(sp));}
  return cellCenter.clone();
}
function pathOf(specs){let out=[];for(const s of specs){if(s==='mtpath')out=out.concat(worldPath('microtubulo_cinesina'));else if(s==='mtpath-r')out=out.concat(worldPath('microtubulo_cinesina').reverse());else out.push(P(s));}return out;}
function curveOf(pts){return pts.length>1?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null;}

let anim=null; const STEP_MS=3400, STEP_MS_M=4800;
const fxTouched=new Set();
function fxReset(){for(const m of fxTouched){m.scale.setScalar(1);m.position.copy(m.userData.home);}fxTouched.clear();if(explode!==0)setExplode(+$('s-exp').value/100);}
function fxApply(fx,u){ if(!fx) return;
  const [k,v]=fx.split(/:(.*)/s);
  if(k==='shrink'){const m=meshByName.get(v);if(!m)return;m.geometry.computeBoundingSphere();const c=m.geometry.boundingSphere.center,s=1-0.92*u;m.scale.setScalar(s);m.position.copy(m.userData.home).addScaledVector(c,1-s);fxTouched.add(m);}
  if(k==='approach'){const [a,b]=v.split('>');const A=meshByName.get(a),B=meshByName.get(b);if(!A||!B)return;A.geometry.computeBoundingSphere();B.geometry.computeBoundingSphere();const d=B.geometry.boundingSphere.center.clone().sub(A.geometry.boundingSphere.center);A.position.copy(A.userData.home).addScaledVector(d,0.45*u);fxTouched.add(A);}
  if(k==='explode'){setExplode(0.35*u);}
}
function procHighlight(step){
  const set=step.focus?new Set(step.focus):null;
  for(const n of meshes){const m=n.material,u=n.userData,on=!set||set.has(u.org.id);
    m.transparent=!on||u.baseTransparent;m.opacity=on?u.baseOpacity:(['act','fi','mt','cit'].includes(u.org.id)?0.02:0.06);m.depthWrite=on&&!u.baseTransparent;if(m.emissive)m.emissive.setRGB(0,0,0);m.needsUpdate=true;}
}
function startProc(id){
  current=null; const pr=PROCS[id];
  const scale=cellSize/600; tracer.scale.setScalar(5*scale); tracer2.scale.setScalar(4*scale); kin.scale.setScalar(4.5*scale); dyn.scale.setScalar(4.5*scale);
  const steps=pr.pasos.map(s=>({...s,pts:pathOf(s.go),pts2:s.go2?pathOf(s.go2):null}));
  const all=steps.flatMap(s=>s.pts); const c=new THREE.Vector3();all.forEach(p=>c.add(p));c.divideScalar(all.length);
  anim={id,steps,i:-1,t0:0,paused:false,pausedAt:0,done:false,target:c,mito:!!pr.mitosis};
  if(anim.mito){enterMitosis();anim.target=cellCenter.clone();}
  goStep(0); renderProcCard();
}
function goStep(i){ if(!anim) return; i=Math.max(0,Math.min(anim.steps.length-1,i));
  anim.i=i; anim.t0=performance.now(); anim.done=false; anim.paused=false;
  const s=anim.steps[i]; anim.curve=curveOf(s.pts); anim.curve2=s.pts2?curveOf(s.pts2):null;
  fxReset(); anim.steps.slice(0,i).forEach(p=>fxApply(p.fx,1));
  procHighlight(s); anim.pulse=new Set(s.pulse||[]);
  if(anim.mito){tracer.visible=tracer2.visible=kin.visible=dyn.visible=false;document.querySelectorAll('.steps li').forEach((li,k)=>li.classList.toggle('on',k===i));const pb0=$('p-pause');if(pb0)pb0.textContent='Pausa';return;}
  tracer.visible=!s.kin&&!s.dyn; kin.visible=!!s.kin; dyn.visible=!!s.dyn; tracer2.visible=false;
  document.querySelectorAll('.steps li').forEach((li,k)=>li.classList.toggle('on',k===i));
  const pb=$('p-pause'); if(pb) pb.textContent='Pausa';
}
function stopProc(){ if(!anim) return; if(anim.mito) exitMitosis(); fxReset(); anim=null; tracer.visible=tracer2.visible=kin.visible=dyn.visible=false; pulseOff(); applyHighlight(); }
function pulseOff(){for(const n of meshes){if(n.material.emissive&&n.userData.pulsing){n.material.emissive.setRGB(0,0,0);n.userData.pulsing=false;}}}
function placeMotor(g,curve,u,now,phase){const p=curve.getPointAt(u),tan=curve.getTangentAt(u);g.position.copy(p);g.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),tan);const ph=((now+phase)/260)%2<1;g.children[0].position.set(ph?1.6:-0.4,0,0);g.children[1].position.set(ph?-0.4:1.6,0,0);}
function tickProc(now){ if(!anim) return;
  controls.target.lerp(anim.target,0.04);
  if(anim.mito){const el=anim.paused?anim.pausedAt:now-anim.t0;const u=Math.min(1,el/STEP_MS_M);updateMitosis(anim.i+u);
    if(!anim.paused&&u>=1){ if(anim.i<anim.steps.length-1) goStep(anim.i+1); else if(!anim.done){anim.done=true;const b=$('p-pause');if(b)b.textContent='Repetir';} } return;}
  const s=anim.steps[anim.i]; const el=anim.paused?anim.pausedAt:now-anim.t0; const u=Math.min(1,el/STEP_MS);
  const sm=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  if(s.kin&&anim.curve) placeMotor(kin,anim.curve,sm,now,0);
  else if(anim.curve) tracer.position.copy(anim.curve.getPointAt(sm));
  else tracer.position.copy(s.pts[0]);
  if(s.dyn){const c2=anim.curve2||anim.curve; if(c2) placeMotor(dyn,anim.curve2?c2:c2,anim.curve2?sm:1-sm,now,130);}
  if(!s.kin){const k=1+0.25*Math.sin(now/180);tracer.scale.setScalar(5*cellSize/600*k);}
  fxApply(s.fx,sm);
  const glow=0.18+0.18*Math.sin(now/170);
  for(const id of anim.pulse)(byOrg.get(id)||[]).forEach(n=>{if(n.material.emissive){n.material.emissive.setRGB(glow,glow,glow*0.6);n.userData.pulsing=true;}});
  if(!anim.paused&&u>=1){ if(anim.i<anim.steps.length-1) goStep(anim.i+1); else if(!anim.done){anim.done=true;const b=$('p-pause');if(b)b.textContent='Repetir';} }
}
function renderProcCard(){
  const a=anim?PROCS[anim.id]:null;
  const chips=PROC_ORDER.map(([t,ids])=>`<div class="group"><h2>${t}</h2><div class="chips">${ids.map(id=>`<button class="chip" data-p="${id}" aria-pressed="${!!(anim&&anim.id===id)}">${PROCS[id].titulo}</button>`).join('')}</div></div>`).join('');
  const srcs=a&&a.refs.length?`<h3>Fuentes de los puntos C</h3><ol class="refs">${a.refs.map(k=>`<li><a href="${REFS[k][1]}" target="_blank" rel="noopener">${REFS[k][0]}</a></li>`).join('')}</ol>`:'';
  card.innerHTML=`<div class="eyebrow">Procesos animados · ${Object.keys(PROCS).length} disponibles</div><h1>${a?a.titulo:'Elige un proceso'}</h1>
   ${a?`<p class="node">${a.tema}</p>
   <div class="row"><button class="btn" id="p-prev">◀ Anterior</button><button class="btn primary" id="p-pause">Pausa</button><button class="btn" id="p-next">Siguiente ▶</button><button class="btn" id="p-stop">Cerrar</button></div>
   <ol class="steps">${a.pasos.map((s,k)=>`<li data-k="${k}" class="${k===anim.i?'on':''}">${s.t} <span class="src ${s.s==='C'?'c':'f'}">${s.s}</span></li>`).join('')}</ol>${srcs}`
   :`<p>Cada proceso avanza paso a paso: la esfera rosa sigue a la molécula, el organelo activo brilla y el resto se atenúa. Puedes pausar o saltar entre pasos.</p>${chips}`}`;
  card.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>startProc(b.dataset.p));
  card.querySelectorAll('.steps li').forEach(li=>{li.style.cursor='pointer';li.onclick=()=>goStep(+li.dataset.k);});
  const g=id=>$(id);
  if(g('p-stop')) g('p-stop').onclick=()=>{stopProc();renderProcCard();};
  if(g('p-prev')) g('p-prev').onclick=()=>goStep(anim.i-1);
  if(g('p-next')) g('p-next').onclick=()=>goStep(anim.i+1);
  if(g('p-pause')) g('p-pause').onclick=()=>{ if(anim.done){goStep(0);return;} anim.paused=!anim.paused; if(anim.paused){anim.pausedAt=performance.now()-anim.t0;g('p-pause').textContent='Reanudar';} else {anim.t0=performance.now()-anim.pausedAt;g('p-pause').textContent='Pausa';} };
}

 ['El lisosoma trabaja a pH neutro.',false,'lis','Trabaja a pH cercano a 5.'],
 ['El RE liso tiene ribosomas pegados.',false,'rel','Los ribosomas están en el RE rugoso.'],
 ['Las vesículas COPII van del RE al Golgi.',true,'copii','COPII es el transporte de ida.'],
 ['La mitocondria tiene su propio DNA circular.',true,'mmat','Está en la matriz.'],
 ['La cinesina camina hacia el centrosoma.',false,'mt','Va hacia el extremo +, la periferia; la dineína va al centrosoma.'],
 ['El nucléolo tiene membrana propia.',false,'nucleolo','Es una zona del núcleo sin membrana.'],
 ['La catalasa del peroxisoma destruye el agua oxigenada.',true,'perox','La convierte en agua y oxígeno.'],
 ['Los microfilamentos de actina son los más gruesos del citoesqueleto.',false,'act','Son los más delgados, unos 7 nm.'],
 ['La heterocromatina se transcribe mucho.',false,'het','Está condensada y casi no se transcribe.'],
 ['Las crestas aumentan la superficie de la membrana interna.',true,'mcr','Más superficie para producir ATP.'],
 ['La cara trans del Golgi recibe el material del RE.',false,'golgi','Lo recibe la cara cis; la trans despacha.'],
 ['La membrana externa del núcleo es continua con el RE.',true,'env','El espacio perinuclear se conecta con el lumen del RE.'],
 ['El autofagosoma tiene una sola membrana.',false,'aut','Tiene doble membrana.'],
 ['Los centríolos tienen 9 tripletes de microtúbulos.',true,'cent','Por eso se ven como barriles de 9 haces.'],
 ['Las vesículas COPI regresan proteínas al RE.',true,'copi','Recuperan las proteínas con señal KDEL.'],
 ['Los ribosomas libres tienen membrana.',false,'ribo','Ningún ribosoma tiene membrana.'],
];
const SEQS=[
 {nombre:'Proteína de secreción',ids:['eu','env','rer','copii','golgi','ves'],txt:['Se transcribe el gen','Sale el ARNm por un poro','Se fabrica y pliega en el RE rugoso','Viaja en vesícula COPII','Se procesa en el Golgi','Sale en vesícula secretora']},
 {nombre:'Enzima del lisosoma',ids:['rer','copii','golgi','clat','lis'],txt:['Se fabrica en el RE rugoso','Viaja en vesícula COPII','Recibe la marca manosa-6-fosfato en el Golgi','Viaja en vesícula de clatrina','Llega al lisosoma']},
 {nombre:'Energía en la mitocondria',ids:['mmat','mcr','mmem'],txt:['Ciclo de Krebs en la matriz','Cadena respiratoria en las crestas','ATP sintasa en la membrana interna']},
];
const MODES={
 nombre:{t:'Por nombre',d:'Te digo el organelo y lo tocas en el modelo.'},
 funcion:{t:'Por función',d:'Te digo qué hace y tú encuentras cuál es.'},
 opciones:{t:'Opción múltiple',d:'Se ilumina un organelo y eliges su nombre.'},
 orden:{t:'Ordenar el recorrido',d:'Tocas los organelos en el orden en que pasa una molécula.'},
 caso:{t:'Caso clínico',d:'Lees un caso y tocas el organelo afectado.'},
 vf:{t:'Verdadero o falso',d:'Juzgas una afirmación sobre el organelo iluminado.'},
 reloj:{t:'Contrarreloj',d:'60 segundos para ubicar la mayor cantidad de organelos.'},
};
const quiz={active:false,mode:'nombre',tema:'all',items:[],i:0,ok:0,last:null,errors:[],focus:null,deadline:0,seq:null,record:0};
try{quiz.record=+localStorage.getItem('celula-record')||0;}catch(e){}
const byId=id=>ORG.find(o=>o.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const inTema=id=>{if(quiz.tema==='all')return true;const o=byId(id);return o&&o.tema.startsWith(quiz.tema);};
function pool(){return QUIZ.filter(o=>anchors.has(o.id)&&inTema(o.id));}
function makeItems(mode){
  if(mode==='nombre'||mode==='reloj') return shuffle(pool()).slice(0,mode==='reloj'?999:10).map(o=>({kind:'tap',prompt:'Toca: '+o.nombre,ans:o.id,sub:'Tema '+o.tema}));
  if(mode==='funcion') return shuffle(Object.entries(FUNC).filter(([id])=>anchors.has(id)&&inTema(id)).map(([id,cl])=>({kind:'tap',prompt:'Toca el organelo que '+cl[Math.random()*cl.length|0]+'.',ans:id}))).slice(0,10);
  if(mode==='opciones') return shuffle(pool()).slice(0,10).map(o=>{const ds=shuffle(QUIZ.filter(x=>x.id!==o.id)).slice(0,3);return {kind:'choice',prompt:'¿Qué organelo está iluminado?',focus:o.id,options:shuffle([o,...ds]).map(x=>({label:x.nombre,val:x.id})),ans:o.id};});
  if(mode==='caso') return shuffle(CASOS.filter(c=>inTema(c[1]))).map(([p,a,w])=>({kind:'tap',prompt:p,ans:a,why:w,sub:'Caso clínico'}));
  if(mode==='vf') return shuffle(VF.filter(v=>inTema(v[2]))).slice(0,10).map(([p,v,o,w])=>({kind:'choice',prompt:p,focus:o,options:[{label:'Verdadero',val:true},{label:'Falso',val:false}],ans:v,why:w}));
  if(mode==='orden'){const s=SEQS[Math.random()*SEQS.length|0];return s.ids.map((id,k)=>({kind:'seq',prompt:`${s.nombre}: paso ${k+1} de ${s.ids.length}`,hint:s.txt[k],ans:id,sub:'Toca el siguiente organelo del recorrido'}));}
  return [];
}
function startQuiz(mode,items){
  stopProc(); current=null; quiz.mode=mode; quiz.items=items||makeItems(mode); quiz.i=0; quiz.ok=0; quiz.last=null; quiz.errors=[]; quiz.active=quiz.items.length>0;
  if(!quiz.active){card.innerHTML+='<p class="no">No hay preguntas de ese tema en este modo. Elige otro tema.</p>';return;}
  if(mode==='reloj') quiz.deadline=performance.now()+60000;
  showItem();
}
function curItem(){return quiz.items[quiz.i];}
function showItem(){const it=curItem(); quiz.focus=it&&it.focus?byId(it.focus):null; applyHighlight(); updateLabels(); renderQuiz();}
function finishQuiz(){quiz.active=false;quiz.focus=null;
  if(quiz.mode==='reloj'&&quiz.ok>quiz.record){quiz.record=quiz.ok;quiz.newRecord=true;try{localStorage.setItem('celula-record',quiz.ok);}catch(e){}} else quiz.newRecord=false;
  applyHighlight(); updateLabels(); renderQuiz();}
function advance(good,picked){const it=curItem(); if(good)quiz.ok++; else quiz.errors.push(it);
  quiz.last={good,picked,it}; quiz.i++;
  if(quiz.mode!=='reloj'&&quiz.i>=quiz.items.length) return finishQuiz();
  if(quiz.mode==='reloj'&&quiz.i>=quiz.items.length){quiz.items=quiz.items.concat(makeItems('reloj'));}
  showItem();}
function answer(o){ if(!quiz.active) return; const it=curItem(); if(!it||it.kind==='choice') return;
  if(it.kind==='seq'){ if(o.id===it.ans){ advance(!it.miss,o); } else { it.miss=true; quiz.last={good:false,picked:o,it,seqWrong:true}; renderQuiz(); } return; }
  advance(o.id===it.ans,o);}
function choose(val){const it=curItem(); if(!it||it.kind!=='choice') return; advance(val===it.ans,typeof val==='string'?byId(val):null);}
function fbHTML(){const l=quiz.last;if(!l)return'';const it=l.it,w=it.why?` ${it.why}`:'';
  if(l.seqWrong) return `<p class="no">${l.picked.nombre} no es el siguiente paso. Pista: ${it.hint}.</p>`;
  if(it.kind==='choice'&&typeof it.ans==='boolean') return `<p class="${l.good?'ok':'no'}">${l.good?'Correcto':'Incorrecto'}: era ${it.ans?'verdadero':'falso'}.${w}</p>`;
  const ansName=byId(it.ans)?byId(it.ans).nombre:'';
  return l.good?`<p class="ok">Correcto: ${ansName}.${w}</p>`:`<p class="no">${l.picked?`Eso era ${l.picked.nombre}; `:''}la respuesta era ${ansName}.${w}</p>`;}
function renderQuiz(){
  if(!quiz.active&&!quiz.items.length){
    card.innerHTML=`<div class="eyebrow">Modo examen</div><h1>Elige un tipo de examen</h1>
     <div class="chips qmodes">${Object.entries(MODES).map(([k,m])=>`<button class="chip" data-m="${k}" aria-pressed="${quiz.mode===k}">${m.t}</button>`).join('')}</div>
     <p id="q-desc">${MODES[quiz.mode].d}</p>
     <label class="node">Tema: <select id="q-tema"><option value="all">Todos</option><option value="1">1 · RE</option><option value="2">2 · Golgi y citoesqueleto</option><option value="3">3 · Lisosomas y peroxisomas</option><option value="4">4 · Núcleo y mitocondria</option></select></label>
     ${quiz.record?`<p class="node">Récord en contrarreloj: ${quiz.record}</p>`:''}
     <div class="row"><button class="btn primary" id="q-go">Empezar</button></div>`;
    $('q-tema').value=quiz.tema; $('q-tema').onchange=e=>quiz.tema=e.target.value;
    card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{quiz.mode=b.dataset.m;renderQuiz();});
    $('q-go').onclick=()=>startQuiz(quiz.mode); return;}
  if(!quiz.active){const total=quiz.i;
    card.innerHTML=`<div class="eyebrow">Resultado · ${MODES[quiz.mode].t}</div><h1>${quiz.ok} de ${total}</h1>${quiz.newRecord?'<p class="ok">¡Nuevo récord!</p>':''}${fbHTML()}
     <div class="row">${quiz.errors.length&&quiz.mode!=='orden'?`<button class="btn primary" id="q-rev">Repasar errores (${quiz.errors.length})</button>`:''}<button class="btn" id="q-again">Otra ronda</button><button class="btn" id="q-menu">Cambiar examen</button></div>`;
    if($('q-rev')) $('q-rev').onclick=()=>{const e=quiz.errors.map(x=>({...x,miss:false}));startQuiz(quiz.mode==='reloj'?'nombre':quiz.mode,e);};
    $('q-again').onclick=()=>startQuiz(quiz.mode); $('q-menu').onclick=()=>{quiz.items=[];renderQuiz();}; return;}
  const it=curItem(); const total=quiz.mode==='reloj'?'∞':quiz.items.length;
  const head=quiz.mode==='reloj'?`<span id="q-timer">60 s</span> · aciertos ${quiz.ok}`:`Pregunta ${quiz.i+1} de ${total} · aciertos ${quiz.ok}`;
  card.innerHTML=`<div class="eyebrow">${MODES[quiz.mode].t} · ${head}</div><h1 class="qh">${it.prompt}</h1>${it.sub?`<p class="node">${it.sub}</p>`:''}
   ${it.kind==='choice'?`<div class="chips">${it.options.map((o,k)=>`<button class="chip" data-c="${k}">${o.label}</button>`).join('')}</div>`:''}
   ${fbHTML()}
   <div class="row">${it.kind==='seq'?`<button class="btn" id="q-hint">Pista</button>`:''}<button class="btn" id="q-skip">No sé, siguiente</button><button class="btn" id="q-end">Terminar</button></div>`;
  card.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(it.options[+b.dataset.c].val));
  if($('q-hint')) $('q-hint').onclick=()=>{quiz.last={good:false,picked:{nombre:'Ese'},it,seqWrong:true};renderQuiz();};
  $('q-skip').onclick=()=>advance(false,null);
  $('q-end').onclick=()=>finishQuiz();
}
function tickQuiz(now){ if(quiz.active&&quiz.focus&&anchors.has(quiz.focus.id)){controls.target.lerp(anchors.get(quiz.focus.id).c,0.06);const g=0.2+0.2*Math.sin(now/160);(byOrg.get(quiz.focus.id)||[]).forEach(n=>{if(n.material.emissive)n.material.emissive.setRGB(g,g,g*0.5);});}
  if(!quiz.active||quiz.mode!=='reloj') return; const left=Math.max(0,quiz.deadline-now); const t=$('q-timer'); if(t) t.textContent=Math.ceil(left/1000)+' s'; if(left<=0) finishQuiz(); }

// ---------- tabs
function setMode(m){mode=m;['explorar','procesos','examen'].forEach(x=>$('tab-'+x).setAttribute('aria-selected',x===m));
  if(m!=='procesos'&&anim) stopProc(); if(m!=='examen'){quiz.active=false;quiz.focus=null;quiz.items=[];}
  if(m==='explorar'){card.innerHTML=orgCard(current);applyHighlight();}
  if(m==='procesos'){renderProcCard();}
  if(m==='examen'){current=null;quiz.items=[];renderQuiz();applyHighlight();}
  renderList();updateLabels();}
['explorar','procesos','examen'].forEach(x=>$('tab-'+x).onclick=()=>setMode(x));

card.innerHTML=orgCard(null);renderList();
let lastL=0;
function render(){renderer.setAnimationLoop(()=>{const now=performance.now();controls.update();try{tickProc(now);}catch(e){console.error(e);stopProc();}tickQuiz(now);renderer.render(scene,camera);if(now-lastL>60){lastL=now;updateLabels();}});}
</script>

</body>
</html>
